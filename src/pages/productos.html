<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/output.css">
    <title>Productos</title>
    <script src="./java/productos.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-gray-900 text-white mt-auto shadow-lg sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-4">
            
            <div class="flex justify-between items-center"> 
                
                <div class="flex items-center"> 
                    <div class="bg-linear-to-r from-red-600 to-orange-600 text-white px-3 py-2 rounded-lg mr-3"> 
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"> 
                            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/> 
                        </svg> 
                    </div> 
                    <h1 class="text-2xl font-extrabold bg-linear-to-r from-red-500 to-orange-900 bg-clip-text text-transparent ">
                        <a href="../pages/index.html">Tienda AXT</a>
                    </h1>
                </div>
    
                <div class="flex items-center space-x-8"> 
                    
                    <div class="hidden md:flex space-x-6"> 
                         <a href="index.html" class="text-white hover:text-orange-600 font-extralight transition-colors duration-200 relative group">inicio<span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-red-600 transition-all duration-200 group-hover:w-full"></span></a>
                         <a href="productos.html" class="text-white hover:text-orange-600 font-extralight transition-colors duration-200 relative group">Productos <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-red-600 transition-all duration-200 group-hover:w-full"></span></a>
                         <a href="categorias.html" class="text-white hover:text-orange-600 font-extralight transition-colors duration-200 relative group">Categorías<span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-red-600 transition-all duration-200 group-hover:w-full"></span></a>
                         <a href="contactenos.html" class="text-white hover:text-orange-600 font-extralight transition-colors duration-200 relative group">Contacto<span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-red-600 transition-all duration-200 group-hover:w-full"></span></a> 
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        
                        
    
                        <!-- Icono del Carrito -->
                        <a href="login.html" class="cart-icon relative group p-2.5 hover:bg-gray-700 rounded-xl transition-all duration-300 transform hover:scale-105">
                            <svg class="w-6 h-6 text-gray-400 group-hover:text-blue-400 transition-all duration-300 group-hover:rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.1 5M7 13l-1.1 5m0 0h1.1m0-5v5m0 0h10m-10 0a2 2 0 104 0m6 0a2 2 0 100 4"/>
                            </svg> 
                            <span id="cart-counter" class="cart-counter-pulse absolute -top-2 -right-2 bg-linear-to-r from-red-500 via-pink-500 to-red-600 text-white text-xs font-bold rounded-full min-w-5 h-5 flex items-center justify-center px-1 shadow-lg border-2 border-white" style="display: none;">0</span> 
                        </a> 
                        
                        <button class="md:hidden text-white hover:text-orange-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
                            </svg>
                        </button>
                        <!-- Icono de Login/Usuario // CAMBIOS DE GEMINI-->
                        <a id="login-icon" href="login.html" class="relative group p-2.5 hover:bg-gray-700 rounded-xl transition-all duration-300 transform hover:scale-105 hidden md:block">
                            <svg class="w-6 h-6 text-gray-400 group-hover:text-blue-400 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </a>
                        
                        <div class="relative hidden" id="user-menu-container">
                            <button id="user-menu-btn" ...>
                                  <span id="user-avatar">?</span>
                             </button>
                            </div>
                    </div>
                </div>   
            </div>
        </nav>
    </header>
   
<!-- Main Content -->
<main class="container mx-auto px-4 py-8">
    <!--buscador y filtros-->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8 my-6">
      <!--BARRA DE BUSQUEDA-->
      <div class="mb-6">
        <div class="relative">
            <input 
            type="text"
            placeholder="buscar productos..."
            class=" w-full pl-12 pr-4 py-3 border border-orange-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
            id="search-input">

            <svg class="absolute left-4 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
      </div>
    
    
    <!--Filtros-->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!--Filtro Categoria-->
    <div >
        <label class="block text-sm font-medium text-gray-700 mb-2" for="">Categoria</label>
        <select class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" id="category-filter">
            <option value="">Todas las categorías</option>
            <option value="laptops">Laptops</option>
            <option value="celulares">Celulares</option>
            <option value="componentes">Componentes PC</option>
            <option value="accesorios">Accesorios</option>
      </select>
    </div> 

    <!-- Filtro Precio -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Rango de Precio</label>
        <select class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="price-filter">
          <option value="">Cualquier precio</option>
          <option value="500000">$0 – $500.000</option>
          <option value="1500000">$500.000 – $1.500.000</option>
          <option value="3000000">$1.500.000 – $3.000.000</option>
          <option value="3000001">Más de $3.000.000</option>
        </select>
      </div>

      <!-- Filtro Ordenamiento -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Ordenar por</label>
        <select class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" id="sort-filter">
          <option value="relevance">Relevancia</option>
          <option value="price-asc">Precio: Menor a Mayor</option>
          <option value="price-desc">Precio: Mayor a Menor</option>
          <option value="newest">Más Nuevos</option>
        </select>
      </div>
    </div>
</div>


<!-- Productos -->
<div>
  <div class="product-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6" id="product-grid">

  </div>
  
      <!-- Barra De Pestañas -->
      <div class="mt-12 mb-4 flex justify-center">
          <nav class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-900">
            <button disabled class="px-3 py-1 text-gray-400 cursor-not-allowed">Anterior</button>
            <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-800">1</button>
            <button class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-blue-100 dark:hover:bg-blue-950">2</button>
            <button class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-blue-100 dark:hover:bg-blue-950">3</button>
            <button class="px-3 py-1 text-gray-700 dark:text-gray-300 hover:text-blue-600">Siguiente</button>
          </nav>
      </div>
  </div>
</main>

<!-- Pie De Pagina -->
<footer></footer>

<!-- ✅ Toast para cerrar sesión -->
<div id="logout-toast" class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
    Sesión cerrada exitosamente
</div>

<script src="../pages/java/perfil.js"></script>
</body>
</html>
